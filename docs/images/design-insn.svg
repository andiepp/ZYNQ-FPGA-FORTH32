<text x="104" y="272" font-size="11" fill="#333">R2P: return (PC ← R/4) · op: new T · T2N: old T into N · N2M: store N at [T] · B: byte store</text>
<text x="104" y="289" font-size="11" fill="#333">rd, dd, fd: return, data and float stack deltas (00 = 0, 01 = +1, 11 = −1, 10 = −2)</text>
<text x="104" y="306" font-size="11" fill="#333">F2M: store FT at [T] · FT2FN: old FT into FN · fop: new FT</text>
